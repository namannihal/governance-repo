deploy-dev-application-gateway-1:
  extends: [.iac_dev_deploy_template]
  variables:
    CLUSTER: "${ENV}_${REGION}_application_gateway_1"
    MANIFEST_FILE: "${BAS_CICD_PROJECT_DIR}/environments/${ENV}/manifest.yaml"
    TERRAFORM_PATH: "${BAS_CICD_PROJECT_DIR}/terraform/application_gateway"
    TERRAFORM_VAR_FILE: "${BAS_CICD_PROJECT_DIR}/environments/${ENV}/terraform-vars/${REGION}/${CLUSTER}.tfvars"
    TF_CORE_TERRAFORM_PLAN_ARGS: "-var-file=${TERRAFORM_VAR_FILE}"
    TERRAFORM_STATE_FILE: "tfstate/${CI_PROJECT_NAME}/${REGION}/${CLUSTER}.tfstate"
    TF_CORE_TERRAFORM_APPLY_ARGS: "-var-file=${TERRAFORM_VAR_FILE} -parallelism=1"
