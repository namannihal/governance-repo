      TF_VAR_guidance_cert@gitlab/app-52161/kv/cert/dev@guidance_cert
      TF_VAR_collection_cert@gitlab/app-52161/kv/cert/dev@collection_cert
      TF_VAR_actualsbre_cert@gitlab/app-52161/kv/cert/dev@actualsbre_cert
      TF_VAR_broker_cert@gitlab/app-52161/kv/cert/dev@broker_cert
      TF_VAR_brokerxl_cert@gitlab/app-52161/kv/cert/dev@brokerxl_cert
      TF_VAR_estimatesbre_cert@gitlab/app-52161/kv/cert/dev@estimatesbre_cert
      TF_VAR_estimatessdi_cert@gitlab/app-52161/kv/cert/dev@estimatessdi_cert
      TF_VAR_guidancebre_cert@gitlab/app-52161/kv/cert/dev@guidancebre_cert
      TF_VAR_hvpweb_cert@gitlab/app-52161/kv/cert/dev@hvpweb_cert
      TF_VAR_qdct_cert@gitlab/app-52161/kv/cert/dev@qdct_cert
