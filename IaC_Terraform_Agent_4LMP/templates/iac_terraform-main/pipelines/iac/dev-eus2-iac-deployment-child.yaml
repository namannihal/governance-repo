#
# Trigger jobs for IaC pipelines
#
# Notes:
# 1 - pipelines are included so may be local or BAS-BC3 stock versions
# 2 - pipelines should be pinned using a versioned tag reference. This is especially important when using BAS-BC3 stock pipelines.
# 3 - include spec variables are only used for labeling stages - they do not control pipeline behaviour. So they can be shortened for readability.
# 4 - include spec variables cannot be set with CICD default, pipeline, or job variables - this is a limitation of GITLAB
#
include:
  - "/environments/dev/pipeline-vars/pipeline-vars.yaml"
  - "/environments/dev/subscription-vars/subscription.yaml"

stages:
  - dev

## IaC template - used by all jobs
.iac_dev_deploy_template:
  stage: dev
  extends: [.dev_pipeline_vars, .dev_subscription_vars_eus]
  variables:
    REGION: "eus2"
    MANIFEST_FILE: "${BAS_CICD_PROJECT_DIR}/environments/${ENV}/manifest.yaml"
    BAS_ENABLE_DYNAMIC_OPE: "true"
    BAS_ENABLE_DESTROY: "true"
    BAS_ENABLE_DEBUG: "false"
  when: manual

###################
### Subnet  #######
###################
deploy-dev-nonrtbl-network-1:
  extends: [.iac_dev_deploy_template]
  variables:
    CLUSTER: "${ENV}_nonrtbl_network_1"
    TERRAFORM_PATH: "${BAS_CICD_PROJECT_DIR}/terraform/nonrtbl-network"
    TERRAFORM_VAR_FILE: "${BAS_CICD_PROJECT_DIR}/environments/${ENV}/terraform-vars/${CLUSTER}.tfvars"
    TF_CORE_TERRAFORM_PLAN_ARGS: "-var-file=${TERRAFORM_VAR_FILE}"
    TERRAFORM_STATE_FILE: "tfstate/${CI_PROJECT_NAME}/${CLUSTER}.tfstate"
    TF_CORE_TERRAFORM_APPLY_ARGS: "-var-file=${TERRAFORM_VAR_FILE} -parallelism=1"
  trigger:
    include:
      - project: 'app/itc-93303/bas-cicd-templates'
        ref: templates-0.0.74
        file: 'templates/iac/pipelines/bas-azure-iac-tfcore-developer-pipeline-v3.yaml'
        inputs:
          env: "dev"
          rgn: "eus2"
          svc: "nonrtbl_network"
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

