#
# Code release tagger
#
1-pipeline-dev-build:
  stage: build
  environment:
    name: release
  variables:
    TAG_PREFIX: pipeline
    PACKAGE_FOLDER: ${LSEG_PIPELINE_PACKAGE_FOLDER}
    INCLUDE_CODE_FOLDERS: ${LSEG_INCLUDE_PIPELINE_FOLDERS}
  trigger:
    include: 
      - project: 'app/itc-93303/bas-cicd-templates'
        ref: templates-0.0.29
        file:
          - 'templates/build/pipelines/build-pipeline-v1.yaml'
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

2-code-dev-build:
  stage: build
  when: manual
  environment:
    name: release
  variables:
    TAG_PREFIX: code
    PACKAGE_FOLDER: ${LSEG_CODE_PACKAGE_FOLDER}
    INCLUDE_CODE_FOLDERS: ${LSEG_INCLUDE_CODE_FOLDERS}
  trigger:
    include: 
      - project: 'app/itc-93303/bas-cicd-templates'
