    TF_CORE_STATE_BACKEND_AZURE_RESOURCE_GROUP: "a1a-51847-ppr-rg-datacloud-eus2-01"
    TF_CORE_STATE_BACKEND_AZURE_STORAGE_ACCOUNT: "a1a51847pprsttfsteus201"
    TF_CORE_STATE_BACKEND_TF_STATE_FILE_KEY: "infra/${ENV}/octopi/ing-ppr-eus2-01.tfstate"
